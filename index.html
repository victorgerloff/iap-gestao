<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gestão de Peças — International Auto Parts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #6b6b65;
    --text3: #9b9b93;
    --navy: #1a3a5c;
    --navy2: #0f2540;
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #0F6E56;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --amber-text: #854F0B;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --red-text: #791F1F;
    --blue-bg: #E6F1FB;
    --blue-text: #185FA5;
    --leaf-bg: #EAF3DE;
    --leaf-text: #3B6D11;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111210;
      --surface: #1c1d1a;
      --surface2: #252622;
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.16);
      --text: #eeeee8;
      --text2: #9a9a92;
      --text3: #6a6a62;
      --green-bg: #04342C; --green-text: #9FE1CB;
      --amber-bg: #412402; --amber-text: #FAC775;
      --red-bg: #501313; --red-text: #F7C1C1;
      --blue-bg: #042C53; --blue-text: #B5D4F4;
      --leaf-bg: #173404; --leaf-text: #C0DD97;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  .app { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 40px; height: 40px; background: var(--navy); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; flex-shrink: 0; }
  .logo-text { font-size: 16px; font-weight: 600; color: var(--text); }
  .logo-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .sync-badge { font-size: 11px; color: var(--green); display: inline-flex; align-items: center; gap: 4px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  @media(max-width:600px){ .stats { grid-template-columns: repeat(2,1fr); } }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-val.green { color: var(--green); }
  .stat-val.amber { color: var(--amber); }
  .stat-val.red { color: var(--red); }

  /* Tabs */
  .tabs { display: flex; gap: 3px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px; width: fit-content; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { padding: 7px 16px; font-size: 13px; border-radius: 7px; cursor: pointer; color: var(--text2); border: none; background: transparent; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
  .tab.active { background: var(--surface); color: var(--text); border: 0.5px solid var(--border2); }
  .tab:hover:not(.active) { color: var(--text); }

  .section { display: none; }
  .section.active { display: block; }

  /* Buttons */
  .btn-primary { background: var(--navy); color: #fff; border: none; padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s; }
  .btn-primary:hover { background: var(--navy2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); padding: 6px 12px; border-radius: 7px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--red); border: 0.5px solid var(--red); padding: 5px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .btn-danger:hover { background: var(--red-bg); }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .filter-row-label { font-size: 12px; color: var(--text3); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    font-size: 13px; padding: 8px 11px; border-radius: var(--radius); border: 0.5px solid var(--border2);
    background: var(--surface); color: var(--text); font-family: inherit;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--navy);
  }
  .search-input { flex: 1; min-width: 180px; }
  .filter-select { font-size: 12px; padding: 7px 10px; }
  .date-input { width: 138px; font-size: 12px; padding: 6px 10px; }

  /* Cards */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 10px; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .piece-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .piece-code { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.returned { background: var(--green-bg); color: var(--green-text); }
  .badge.used { background: var(--blue-bg); color: var(--blue-text); }
  .badge.credited { background: var(--leaf-bg); color: var(--leaf-text); }
  .badge.pending { background: var(--amber-bg); color: var(--amber-text); }

  .piece-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  @media(max-width:480px){ .piece-meta { grid-template-columns: 1fr 1fr; } }
  .meta-item { font-size: 11px; color: var(--text3); }
  .meta-item span { display: block; font-size: 13px; color: var(--text); margin-top: 2px; font-weight: 500; }
  .piece-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .piece-value { font-size: 16px; font-weight: 700; color: var(--text); }
  .piece-obs { font-size: 12px; color: var(--amber-text); background: var(--amber-bg); width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; margin-top: 2px; display: flex; align-items: flex-start; gap: 6px; }
  .piece-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 540px; border: 0.5px solid var(--border2); max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  @media(max-width:480px){ .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--text2); font-weight: 600; }
  .form-group input, .form-group select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }

  /* Report */
  .report-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-label { font-size: 15px; font-weight: 600; min-width: 160px; text-align: center; }
  .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  @media(max-width:560px){ .report-summary { grid-template-columns: 1fr 1fr; } }
  .report-card { background: var(--surface2); border-radius: var(--radius); padding: 14px 16px; }
  .report-card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .report-card-val { font-size: 20px; font-weight: 700; }
  .report-section-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin: 1rem 0 8px; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 1rem; }
  .summary-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); font-weight: 600; padding: 6px 10px; border-bottom: 0.5px solid var(--border2); }
  .summary-table td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); }
  .summary-table tr:last-child td { border-bottom: none; }
  .print-btn { margin-left: auto; }
  @media print {
    .tabs, .header .btn-primary, .piece-actions, .modal-overlay, .print-btn, .month-nav button { display: none !important; }
    .section { display: block !important; }
    .app { padding: 0; }
    body { background: #fff; color: #000; }
  }

  /* Credit view */
  .credit-block { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .credit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .credit-row:last-child { border-bottom: none; }
  .total-credit-row { display: flex; justify-content: space-between; padding: 10px 0 0; font-weight: 700; font-size: 15px; margin-top: 4px; border-top: 1px solid var(--border2); }
  .val-green { color: var(--green); font-weight: 700; }
  .val-red { color: var(--red); font-weight: 700; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }
  .empty i { font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.5; }
  .period-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); margin-left: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><i class="ti ti-car"></i></div>
      <div>
        <div class="logo-text">Gestão de Peças</div>
        <div class="logo-sub">International Auto Parts &nbsp;<span id="sync-status" class="sync-badge"></span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="user-email" style="font-size:12px;color:var(--text2);"></span>
      <button class="btn-ghost" onclick="doLogout()" title="Sair"><i class="ti ti-logout"></i></button>
      <button class="btn-primary" onclick="openModal()"><i class="ti ti-plus"></i> Nova Peça</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">Devolvidas</div><div class="stat-val amber" id="s-dev">—</div></div>
    <div class="stat"><div class="stat-label">Pendentes</div><div class="stat-val red" id="s-pend">—</div></div>
    <div class="stat"><div class="stat-label">A receber</div><div class="stat-val green" id="s-val">—</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('todas')">Todas</button>
    <button class="tab" onclick="setTab('utilizadas')">Utilizadas</button>
    <button class="tab" onclick="setTab('devolvidas')">Devolvidas</button>
    <button class="tab" onclick="setTab('creditos')">Créditos</button>
    <button class="tab" onclick="setTab('relatorio')">Relatório Mensal</button>
  </div>

  <!-- TODAS -->
  <div class="section active" id="sec-todas">
    <div class="filters">
      <input type="text" class="search-input" placeholder="Buscar peça, código, carro ou fornecedor..." oninput="renderAll()" id="search">
      <select class="filter-select" onchange="renderAll()" id="filter-status">
        <option value="">Todos os status</option>
        <option value="utilizada">Utilizadas</option>
        <option value="devolvida">Devolvidas</option>
      </select>
      <select class="filter-select" onchange="renderAll()" id="filter-credito">
        <option value="">Crédito: todos</option>
        <option value="creditada">Creditada</option>
        <option value="pendente">Pendente</option>
      </select>
    </div>
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Período:</span>
      <input type="date" class="date-input" id="date-from" onchange="renderAll()">
      <span class="filter-row-label">até</span>
      <input type="date" class="date-input" id="date-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('')">Limpar</button>
    </div>
    <div id="list-todas"></div>
  </div>

  <!-- UTILIZADAS -->
  <div class="section" id="sec-utilizadas">
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Período:</span>
      <input type="date" class="date-input" id="udate-from" onchange="renderAll()">
      <span class="filter-row-label">até</span>
      <input type="date" class="date-input" id="udate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('u')">Limpar</button>
    </div>
    <div id="list-utilizadas"></div>
  </div>

  <!-- DEVOLVIDAS -->
  <div class="section" id="sec-devolvidas">
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Período:</span>
      <input type="date" class="date-input" id="ddate-from" onchange="renderAll()">
      <span class="filter-row-label">até</span>
      <input type="date" class="date-input" id="ddate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('d')">Limpar</button>
    </div>
    <div id="list-devolvidas"></div>
  </div>

  <!-- CRÉDITOS -->
  <div class="section" id="sec-creditos">
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Período:</span>
      <input type="date" class="date-input" id="cdate-from" onchange="renderAll()">
      <span class="filter-row-label">até</span>
      <input type="date" class="date-input" id="cdate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('c')">Limpar</button>
    </div>
    <div id="creditos-view"></div>
  </div>

  <!-- RELATÓRIO MENSAL -->
  <div class="section" id="sec-relatorio">
    <div class="report-header">
      <div class="month-nav">
        <button class="btn-ghost" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <div class="month-label" id="month-label">—</div>
        <button class="btn-ghost" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <button class="btn-ghost print-btn" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
    </div>
    <div id="report-content"></div>
  </div>
</div>

<!-- LOGIN -->
<div class="modal-overlay open" id="login-overlay">
  <div class="modal" style="max-width:360px;">
    <div class="modal-title">Entrar</div>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div class="form-group"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="login-password" placeholder="Minimo 6 caracteres"></div>
    </div>
    <div id="login-error" style="color:var(--red);font-size:12px;margin-top:4px;min-height:14px;"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="doSignup()">Criar conta</button>
      <button class="btn-primary" onclick="doLogin()"><i class="ti ti-login"></i> Entrar</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Nova Peça</div>
    <div class="form-grid">
      <div class="form-group"><label>Nome da Peça *</label><input type="text" id="f-nome" placeholder="Ex: Filtro de óleo"></div>
      <div class="form-group"><label>Código da Peça</label><input type="text" id="f-codigo" placeholder="Ex: 15400-PLM-A02"></div>
      <div class="form-group"><label>Carro / Veículo</label><input type="text" id="f-carro" placeholder="Ex: Honda Civic 2019"></div>
      <div class="form-group"><label>Fornecedor</label><input type="text" id="f-fornecedor" placeholder="Ex: João Silva"></div>
      <div class="form-group"><label>Data</label><input type="date" id="f-data"></div>
      <div class="form-group"><label>Valor (US$)</label><input type="number" id="f-valor" placeholder="0.00" step="any" min="0"></div>
      <div class="form-group"><label>Status</label>
        <select id="f-status">
          <option value="utilizada">Utilizada</option>
          <option value="devolvida">Devolvida</option>
        </select>
      </div>
      <div class="form-group"><label>Crédito</label>
        <select id="f-credito">
          <option value="pendente">Pendente</option>
          <option value="creditada">Creditada</option>
        </select>
      </div>
      <div class="form-group full"><label>Observações</label><input type="text" id="f-obs" placeholder="Notas adicionais..."></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="salvar()"><i class="ti ti-device-floppy"></i> Salvar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDO_SHL71igs8O5ODCQnwxhMXVnQ86UBvc",
    authDomain: "gestao-de-pecas-international.firebaseapp.com",
    projectId: "gestao-de-pecas-international",
    storageBucket: "gestao-de-pecas-international.firebasestorage.app",
    messagingSenderId: "531733990676",
    appId: "1:531733990676:web:9b5d3b25f7a233bd210601",
    measurementId: "G-49R6FR0S9T"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const dbFs = getFirestore(fbApp);

  window.IAP_FB = {
    signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
    signUp: (email, pw) => createUserWithEmailAndPassword(auth, email, pw),
    signOutUser: () => signOut(auth),
    onAuth: (cb) => onAuthStateChanged(auth, cb),
    savePeca: (p) => setDoc(doc(collection(dbFs, 'pecas'), p.id), p),
    deletePeca: (id) => deleteDoc(doc(collection(dbFs, 'pecas'), id)),
    updateCredito: (id, val) => updateDoc(doc(collection(dbFs, 'pecas'), id), { credito: val }),
    listenPecas: (cb, onError) => onSnapshot(collection(dbFs, 'pecas'), snap => {
      const arr = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      cb(arr);
    }, onError)
  };
  window.dispatchEvent(new Event('iapFbReady'));
</script>
<script>
const LS_KEY = 'iap_pecas_v2';
let DB = [];
let editId = null;
let currentTab = 'todas';
let reportMonth = new Date().getMonth();
let reportYear = new Date().getFullYear();

// Storage
function dbLoad() {}
function dbSave() {}
let syncTimer;
function showSync() {
  clearTimeout(syncTimer);
  const el = document.getElementById('sync-status');
  el.style.color = 'var(--green)';
  el.innerHTML = '<i class="ti ti-cloud-check"></i> sincronizado';
  syncTimer = setTimeout(()=>{ el.innerHTML=''; }, 2500);
}
function showSyncError(err) {
  clearTimeout(syncTimer);
  console.error('Erro ao sincronizar com o Firestore:', err);
  const el = document.getElementById('sync-status');
  el.style.color = 'var(--red)';
  el.innerHTML = '<i class="ti ti-cloud-off"></i> erro de sincronização';
}

// Auth
function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  window.IAP_FB.signIn(email, pw).catch(e => { errEl.textContent = traduzErroAuth(e.code); });
}
function doSignup() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  window.IAP_FB.signUp(email, pw).catch(e => { errEl.textContent = traduzErroAuth(e.code); });
}
function doLogout() {
  window.IAP_FB.signOutUser();
}
function traduzErroAuth(code) {
  const map = {
    'auth/invalid-email': 'E-mail invalido',
    'auth/user-not-found': 'Usuario nao encontrado',
    'auth/wrong-password': 'Senha incorreta',
    'auth/email-already-in-use': 'E-mail ja cadastrado',
    'auth/weak-password': 'Senha muito curta (minimo 6 caracteres)',
    'auth/invalid-credential': 'E-mail ou senha invalidos',
    'auth/missing-email': 'Informe o e-mail',
    'auth/missing-password': 'Informe a senha'
  };
  return map[code] || ('Erro: ' + code);
}
function initAuthFlow() {
  window.IAP_FB.onAuth(user => {
    const overlay = document.getElementById('login-overlay');
    if (user) {
      overlay.classList.remove('open');
      document.getElementById('user-email').textContent = user.email;
      window.IAP_FB.listenPecas(data => { DB = data; renderAll(); showSync(); }, showSyncError);
    } else {
      overlay.classList.add('open');
      document.getElementById('user-email').textContent = '';
    }
  });
}
if (window.IAP_FB) { initAuthFlow(); } else { window.addEventListener('iapFbReady', initAuthFlow); }

// Helpers
function fmtVal(v) { return 'US$ ' + (v||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:20}); }
function fmtDate(d) { if(!d) return '—'; const [y,m,di] = d.split('-'); return di+'/'+m+'/'+y; }
function inPeriod(date, fromId, toId) {
  const f = document.getElementById(fromId)?.value;
  const t = document.getElementById(toId)?.value;
  if(f && date < f) return false;
  if(t && date > t) return false;
  return true;
}
function clearDates(prefix) {
  const p = prefix ? prefix+'date' : 'date';
  ['from','to'].forEach(s => { const el = document.getElementById(p+'-'+s); if(el) el.value=''; });
  renderAll();
}

// Card HTML
function cardHTML(p) {
  const sb = p.status === 'devolvida'
    ? '<span class="badge returned"><i class="ti ti-arrow-back-up"></i> Devolvida</span>'
    : '<span class="badge used"><i class="ti ti-check"></i> Utilizada</span>';
  const cb = p.status === 'devolvida'
    ? (p.credito === 'creditada'
      ? '<span class="badge credited"><i class="ti ti-circle-check"></i> Creditada</span>'
      : '<span class="badge pending"><i class="ti ti-clock"></i> Pendente</span>')
    : '';
  const creditBtn = p.status === 'devolvida'
    ? `<button class="btn-ghost" onclick="toggleCredito('${p.id}')"><i class="ti ti-${p.credito==='creditada'?'circle-minus':'circle-check'}"></i> ${p.credito==='creditada'?'Marcar pendente':'Marcar creditada'}</button>`
    : '';
  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="piece-name">${p.nome}</div>
        ${p.codigo ? `<div class="piece-code"><i class="ti ti-barcode" style="font-size:11px"></i> ${p.codigo}</div>` : ''}
      </div>
      <div class="badges">${sb}${cb}</div>
    </div>
    <div class="piece-meta">
      <div class="meta-item"><i class="ti ti-car" style="font-size:11px"></i> Veículo<span>${p.carro||'—'}</span></div>
      <div class="meta-item"><i class="ti ti-user" style="font-size:11px"></i> Fornecedor<span>${p.fornecedor||'—'}</span></div>
      <div class="meta-item"><i class="ti ti-calendar" style="font-size:11px"></i> Data<span>${fmtDate(p.data)}</span></div>
    </div>
    <div class="piece-footer">
      <div class="piece-value">${fmtVal(p.valor)}</div>
      ${p.obs ? `<div class="piece-obs"><i class="ti ti-note"></i><span>${p.obs}</span></div>` : ''}
    </div>
    <div class="piece-actions" style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)">
      ${creditBtn}
      <button class="btn-ghost" onclick="openModal('${p.id}')"><i class="ti ti-edit"></i> Editar</button>
      <button class="btn-danger" onclick="deletar('${p.id}')"><i class="ti ti-trash"></i></button>
    </div>
  </div>`;
}

function emptyHTML() {
  return '<div class="empty"><i class="ti ti-package-off"></i>Nenhuma peça encontrada</div>';
}

// Renders
function renderStats() {
  const dev = DB.filter(p => p.status === 'devolvida');
  const pend = dev.filter(p => p.credito === 'pendente');
  document.getElementById('s-total').textContent = DB.length;
  document.getElementById('s-dev').textContent = dev.length;
  document.getElementById('s-pend').textContent = pend.length;
  document.getElementById('s-val').textContent = fmtVal(pend.reduce((s,p)=>s+p.valor,0));
}

function renderTodas() {
  const search = (document.getElementById('search')?.value||'').toLowerCase();
  const fS = document.getElementById('filter-status')?.value||'';
  const fC = document.getElementById('filter-credito')?.value||'';
  const filtered = DB.filter(p => {
    if(search && !`${p.nome} ${p.codigo} ${p.carro} ${p.fornecedor}`.toLowerCase().includes(search)) return false;
    if(fS && p.status !== fS) return false;
    if(fC && p.credito !== fC) return false;
    return inPeriod(p.data, 'date-from', 'date-to');
  });
  document.getElementById('list-todas').innerHTML = filtered.length ? filtered.map(cardHTML).join('') : emptyHTML();
}

function renderSec(listId, filter, fromId, toId) {
  const arr = DB.filter(p => filter(p) && inPeriod(p.data, fromId, toId));
  document.getElementById(listId).innerHTML = arr.length ? arr.map(cardHTML).join('') : emptyHTML();
}

function renderCreditos() {
  const all = DB.filter(p => p.status === 'devolvida' && inPeriod(p.data, 'cdate-from', 'cdate-to'));
  const credited = all.filter(p => p.credito === 'creditada');
  const pending = all.filter(p => p.credito === 'pendente');
  const totalCred = credited.reduce((s,p)=>s+p.valor,0);
  const totalPend = pending.reduce((s,p)=>s+p.valor,0);
  const el = document.getElementById('creditos-view');
  if(!all.length) { el.innerHTML = emptyHTML(); return; }
  let html = `<div class="credit-block">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px"><i class="ti ti-report-money"></i> Resumo — IAP</div>
    <div class="credit-row"><span>Total devolvido</span><span style="font-weight:600">${fmtVal(all.reduce((s,p)=>s+p.valor,0))}</span></div>
    <div class="credit-row"><span>Já creditado</span><span class="val-green">${fmtVal(totalCred)}</span></div>
    <div class="credit-row"><span>Aguardando crédito</span><span class="val-red">${fmtVal(totalPend)}</span></div>
    <div class="total-credit-row"><span>Saldo a receber</span><span class="val-red">${fmtVal(totalPend)}</span></div>
  </div>`;
  if(pending.length) {
    html += `<div class="report-section-title">Pendentes (${pending.length})</div>${pending.map(cardHTML).join('')}`;
  }
  if(credited.length) {
    html += `<div class="report-section-title" style="margin-top:1rem">Creditadas (${credited.length})</div>${credited.map(cardHTML).join('')}`;
  }
  el.innerHTML = html;
}

function renderReport() {
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('month-label').textContent = `${months[reportMonth]} ${reportYear}`;
  const yStr = String(reportYear);
  const mStr = String(reportMonth+1).padStart(2,'0');
  const prefix = `${yStr}-${mStr}`;
  const month = DB.filter(p => p.data && p.data.startsWith(prefix));
  const used = month.filter(p => p.status === 'utilizada');
  const returned = month.filter(p => p.status === 'devolvida');
  const credited = returned.filter(p => p.credito === 'creditada');
  const pending = returned.filter(p => p.credito === 'pendente');
  const totalUsed = used.reduce((s,p)=>s+p.valor,0);
  const totalRet = returned.reduce((s,p)=>s+p.valor,0);
  const totalPend = pending.reduce((s,p)=>s+p.valor,0);
  const totalCred = credited.reduce((s,p)=>s+p.valor,0);

  if(!month.length) {
    document.getElementById('report-content').innerHTML = '<div class="empty"><i class="ti ti-calendar-off"></i>Nenhuma peça registrada neste mês</div>';
    return;
  }

  let tableRows = month.map(p => `<tr>
    <td>${p.nome}${p.codigo?`<br><span style="font-size:11px;color:var(--text3)">${p.codigo}</span>`:''}</td>
    <td>${p.carro||'—'}</td>
    <td>${p.fornecedor||'—'}</td>
    <td>${fmtDate(p.data)}</td>
    <td style="text-align:right;font-weight:600">${fmtVal(p.valor)}</td>
    <td>${p.status==='devolvida'?`<span class="badge returned">Dev.</span>`:`<span class="badge used">Usada</span>`}</td>
    <td>${p.status==='devolvida'?(p.credito==='creditada'?`<span class="badge credited">Sim</span>`:`<span class="badge pending">Não</span>`):'—'}</td>
  </tr>`).join('');

  document.getElementById('report-content').innerHTML = `
    <div class="report-summary">
      <div class="report-card"><div class="report-card-label">Peças no mês</div><div class="report-card-val">${month.length}</div></div>
      <div class="report-card"><div class="report-card-label">Utilizadas</div><div class="report-card-val" style="color:var(--blue-text)">${used.length} — ${fmtVal(totalUsed)}</div></div>
      <div class="report-card"><div class="report-card-label">Devolvidas</div><div class="report-card-val" style="color:var(--amber)">${returned.length} — ${fmtVal(totalRet)}</div></div>
      <div class="report-card"><div class="report-card-label">Crédito recebido</div><div class="report-card-val" style="color:var(--green)">${fmtVal(totalCred)}</div></div>
      <div class="report-card"><div class="report-card-label">Crédito pendente</div><div class="report-card-val" style="color:var(--red)">${fmtVal(totalPend)}</div></div>
    </div>
    <div class="report-section-title">Todas as peças do mês</div>
    <div style="overflow-x:auto">
    <table class="summary-table">
      <thead><tr>
        <th>Peça</th><th>Veículo</th><th>Fornecedor</th><th>Data</th><th style="text-align:right">Valor</th><th>Status</th><th>Crédito</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    </div>`;
}

function changeMonth(dir) {
  reportMonth += dir;
  if(reportMonth < 0) { reportMonth = 11; reportYear--; }
  if(reportMonth > 11) { reportMonth = 0; reportYear++; }
  renderReport();
}

function renderAll() {
  renderStats();
  renderTodas();
  renderSec('list-utilizadas', p=>p.status==='utilizada', 'udate-from','udate-to');
  renderSec('list-devolvidas', p=>p.status==='devolvida', 'ddate-from','ddate-to');
  renderCreditos();
  renderReport();
}

// Modal
function openModal(id) {
  editId = id || null;
  document.getElementById('modal-title').textContent = id ? 'Editar Peça' : 'Nova Peça';
  if(id) {
    const p = DB.find(x => x.id === id);
    if(p) {
      ['nome','codigo','carro','fornecedor','obs'].forEach(k => document.getElementById('f-'+k).value = p[k]||'');
      document.getElementById('f-data').value = p.data||'';
      document.getElementById('f-valor').value = p.valor||'';
      document.getElementById('f-status').value = p.status||'utilizada';
      document.getElementById('f-credito').value = p.credito||'pendente';
    }
  } else {
    ['nome','codigo','carro','fornecedor','obs'].forEach(k => document.getElementById('f-'+k).value = '');
    document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-valor').value = '';
    document.getElementById('f-status').value = 'utilizada';
    document.getElementById('f-credito').value = 'pendente';
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function salvar() {
  const nome = document.getElementById('f-nome').value.trim();
  if (!nome) { alert('Informe o nome da peça'); return; }
  const p = {
    id: editId || Date.now().toString(),
    nome, codigo: document.getElementById('f-codigo').value.trim(),
    carro: document.getElementById('f-carro').value.trim(),
    fornecedor: document.getElementById('f-fornecedor').value.trim(),
    data: document.getElementById('f-data').value,
    valor: parseFloat(document.getElementById('f-valor').value)||0,
    status: document.getElementById('f-status').value,
    credito: document.getElementById('f-credito').value,
    obs: document.getElementById('f-obs').value.trim()
  };
  window.IAP_FB.savePeca(p).then(()=>{ closeModal(); }).catch(e=>alert('Erro ao salvar: '+e.message));
}
function deletar(id) {
  if(!confirm('Remover esta peça?')) return;
  window.IAP_FB.deletePeca(id).catch(e=>alert('Erro ao remover: '+e.message));
}
function toggleCredito(id) {
  const p = DB.find(x=>x.id===id);
  const novo = p.credito === 'creditada' ? 'pendente' : 'creditada';
  window.IAP_FB.updateCredito(id, novo).catch(e=>alert('Erro: '+e.message));
}
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  if(tab === 'relatorio') renderReport();
}

document.getElementById('modal').addEventListener('click', e => { if(e.target === document.getElementById('modal')) closeModal(); });

// Auth flow ja inicializado (initAuthFlow) cuida do carregamento inicial via listenPecas
</script>
