<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gestão de Peças Planet Automotive Group</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1a3a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planet Parts">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #6b6b65;
    --text3: #9b9b93;
    --navy: #1a3a5c;
    --navy2: #0f2540;
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #0F6E56;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --amber-text: #854F0B;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --red-text: #791F1F;
    --blue-bg: #E6F1FB;
    --blue-text: #185FA5;
    --leaf-bg: #EAF3DE;
    --leaf-text: #3B6D11;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111210;
      --surface: #1c1d1a;
      --surface2: #252622;
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.16);
      --text: #eeeee8;
      --text2: #9a9a92;
      --text3: #6a6a62;
      --green-bg: #04342C; --green-text: #9FE1CB;
      --amber-bg: #412402; --amber-text: #FAC775;
      --red-bg: #501313; --red-text: #F7C1C1;
      --blue-bg: #042C53; --blue-text: #B5D4F4;
      --leaf-bg: #173404; --leaf-text: #C0DD97;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #000;
    color: var(--text);
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -30px;
    background-image: url('assets/logo-planet.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(35px) brightness(0.35);
    opacity: 0.6;
    z-index: -1;
  }

  /* Layout */
  .app { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .logo { display: flex; align-items: center; gap: 17px; }
  .logo-icon { width: 56px; height: 56px; background: var(--navy); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; flex-shrink: 0; overflow: hidden; }
  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .logo-text { font-size: 22px; font-weight: 600; color: #fff; }
  .logo-sub { font-size: 17px; color: var(--text2); margin-top: 1px; }
  .sync-badge { font-size: 11px; color: var(--green); display: inline-flex; align-items: center; gap: 4px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  @media(max-width:600px){ .stats { grid-template-columns: repeat(2,1fr); } }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-val.green { color: var(--green); }
  .stat-val.amber { color: var(--amber); }
  .stat-val.red { color: var(--red); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 5px; width: fit-content; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { padding: 9px 18px; font-size: 14px; border-radius: 7px; cursor: pointer; color: var(--text2); border: none; background: transparent; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
  .tab.active { background: var(--surface); color: var(--text); border: 0.5px solid var(--border2); }
  @media(min-width:601px){
    .logo-text { text-transform: uppercase; letter-spacing: 0.5px; }
    .logo-icon { width: 78px; height: 78px; font-size: 39px; border-radius: 20px; }
    .tabs { width: 100%; }
    .tab { flex: 1; text-align: center; }
  }
  .tab:hover:not(.active) { color: var(--text); }

  .section { display: none; }
  .section.active { display: block; }

  /* Buttons */
  .btn-primary { background: var(--navy); color: #fff; border: none; padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s; }
  .btn-primary:hover { background: var(--navy2); }
  .btn-ghost { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); padding: 6px 12px; border-radius: 7px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--red); border: 0.5px solid var(--red); padding: 5px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .btn-danger:hover { background: var(--red-bg); }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .filter-row-label { font-size: 12px; color: var(--text3); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    font-size: 13px; padding: 8px 11px; border-radius: var(--radius); border: 0.5px solid var(--border2);
    background: var(--surface); color: var(--text); font-family: inherit;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--navy);
  }
  .search-input { flex: 1; min-width: 180px; }
  .filter-select { font-size: 12px; padding: 7px 10px; }
  .date-input { width: 138px; font-size: 12px; padding: 6px 10px; }

  /* Cards */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 10px; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .piece-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .piece-code { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text3); margin-top: 6px; }
  .piece-code .part-number { font-size: 13px; font-weight: 700; color: var(--text2); }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.returned { background: var(--green-bg); color: var(--green-text); }
  .badge.used { background: var(--blue-bg); color: var(--blue-text); }
  .badge.credited { background: var(--leaf-bg); color: var(--leaf-text); }
  .badge.pending { background: var(--amber-bg); color: var(--amber-text); }

  .card-actions-right { display: flex; gap: 8px; }
  .icon-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger { color: var(--red); border-color: var(--red); }
  .icon-btn.danger:hover { background: var(--red-bg); }

  .piece-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .meta-item { flex: 1 1 0; min-width: 70px; font-size: 11px; color: var(--text3); }
  .meta-item span { display: block; font-size: 13px; color: var(--text); margin-top: 2px; font-weight: 500; }
  .piece-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); flex-wrap: wrap; gap: 16px; }
  .piece-obs { font-size: 12px; color: var(--amber-text); background: var(--amber-bg); width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; margin-top: 2px; display: flex; align-items: flex-start; gap: 6px; }

  .credit-toggle { display: inline-flex; border-radius: 7px; overflow: hidden; border: 0.5px solid var(--border2); }
  .credit-opt { padding: 6px 14px; font-size: 12px; font-weight: 600; border: none; background: var(--surface2); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .credit-opt + .credit-opt { border-left: 0.5px solid var(--border2); }
  .credit-opt.active-green { background: var(--green); color: #fff; }
  .credit-opt.active-red { background: var(--red); color: #fff; }
  .credit-opt:hover:not(.active-green):not(.active-red) { background: var(--border2); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 680px; border: 0.5px solid var(--border2); max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  @media(max-width:480px){ .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-trio { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media(max-width:480px){ .form-trio { grid-template-columns: 1fr; } }
  label { font-size: 12px; color: var(--text2); font-weight: 600; }
  .form-group input, .form-group select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }

  /* Report */
  .report-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-label { font-size: 15px; font-weight: 600; min-width: 160px; text-align: center; }
  .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  @media(max-width:560px){ .report-summary { grid-template-columns: 1fr 1fr; } }
  .report-card { background: var(--surface2); border-radius: var(--radius); padding: 14px 16px; }
  .report-card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .report-card-val { font-size: 20px; font-weight: 700; }
  .report-section-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin: 1rem 0 8px; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 1rem; }
  .summary-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); font-weight: 600; padding: 6px 10px; border-bottom: 0.5px solid var(--border2); }
  .summary-table td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); }
  .summary-table tr:last-child td { border-bottom: none; }
  .print-btn { margin-left: auto; }
  @media print {
    .tabs, .header .btn-primary, .card-actions-right, .modal-overlay, .print-btn, .month-nav button, #filter-supplier-report { display: none !important; }
    .section { display: none !important; }
    .section.active { display: block !important; }
    .app { padding: 0; }
    body { background: #fff; color: #000; }
  }

  /* Credit view */
  .credit-block { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .credit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .credit-row:last-child { border-bottom: none; }
  .total-credit-row { display: flex; justify-content: space-between; padding: 10px 0 0; font-weight: 700; font-size: 15px; margin-top: 4px; border-top: 1px solid var(--border2); }
  .val-green { color: var(--green); font-weight: 700; }
  .val-red { color: var(--red); font-weight: 700; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }
  .empty i { font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.5; }
  .period-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); margin-left: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><img src="assets/logo-planet.jpg" alt="Planet Automotive Group"></div>
      <div>
        <div class="logo-text">Gestão de Peças</div>
        <div class="logo-sub">Planet Automotive Group &nbsp;<span id="sync-status" class="sync-badge"></span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="user-email" style="font-size:12px;color:var(--text2);"></span>
      <button class="btn-ghost" onclick="doLogout()" title="Log out"><i class="ti ti-logout"></i></button>
      <button class="btn-primary" onclick="openModal()"><i class="ti ti-plus"></i> New Part</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">Returned</div><div class="stat-val amber" id="s-dev">—</div></div>
    <div class="stat"><div class="stat-label">Pending</div><div class="stat-val red" id="s-pend">—</div></div>
    <div class="stat"><div class="stat-label">Receivable</div><div class="stat-val green" id="s-val">—</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('todas')">All</button>
    <button class="tab" onclick="setTab('utilizadas')">Not Returned</button>
    <button class="tab" onclick="setTab('devolvidas')">Returned</button>
    <button class="tab" onclick="setTab('creditos')">Credits</button>
    <button class="tab" onclick="setTab('relatorio')">Monthly Report</button>
  </div>

  <!-- TODAS -->
  <div class="section active" id="sec-todas">
    <div class="filters">
      <input type="text" class="search-input" placeholder="Search part, code, vehicle or supplier..." oninput="renderAll()" id="search">
      <select class="filter-select" onchange="renderAll()" id="filter-status">
        <option value="">All statuses</option>
        <option value="utilizada">Not Returned</option>
        <option value="devolvida">Returned</option>
      </select>
      <select class="filter-select" onchange="renderAll()" id="filter-credito">
        <option value="">Credit: all</option>
        <option value="creditada">Credited</option>
        <option value="pendente">Pending</option>
      </select>
      <button class="btn-ghost" onclick="toggleSort()"><i class="ti ti-arrows-sort"></i> <span id="sort-label">Newest first</span></button>
    </div>
    <div class="filters">
      <select class="filter-select" onchange="renderAll()" id="filter-supplier-todas">
        <option value="">All suppliers</option>
      </select>
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Period:</span>
      <input type="date" class="date-input" id="date-from" onchange="renderAll()">
      <span class="filter-row-label">to</span>
      <input type="date" class="date-input" id="date-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('')">Clear</button>
    </div>
    <div id="list-todas"></div>
  </div>

  <!-- UTILIZADAS -->
  <div class="section" id="sec-utilizadas">
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Period:</span>
      <input type="date" class="date-input" id="udate-from" onchange="renderAll()">
      <span class="filter-row-label">to</span>
      <input type="date" class="date-input" id="udate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('u')">Clear</button>
    </div>
    <div id="list-utilizadas"></div>
  </div>

  <!-- DEVOLVIDAS -->
  <div class="section" id="sec-devolvidas">
    <div class="filters">
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Period:</span>
      <input type="date" class="date-input" id="ddate-from" onchange="renderAll()">
      <span class="filter-row-label">to</span>
      <input type="date" class="date-input" id="ddate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('d')">Clear</button>
    </div>
    <div id="list-devolvidas"></div>
  </div>

  <!-- CRÉDITOS -->
  <div class="section" id="sec-creditos">
    <div class="filters">
      <select class="filter-select" onchange="renderAll()" id="filter-supplier-credito">
        <option value="">All suppliers</option>
      </select>
      <span class="filter-row-label"><i class="ti ti-calendar" style="font-size:14px"></i> Period:</span>
      <input type="date" class="date-input" id="cdate-from" onchange="renderAll()">
      <span class="filter-row-label">to</span>
      <input type="date" class="date-input" id="cdate-to" onchange="renderAll()">
      <button class="btn-ghost" onclick="clearDates('c')">Clear</button>
    </div>
    <div id="creditos-view"></div>
  </div>

  <!-- RELATÓRIO MENSAL -->
  <div class="section" id="sec-relatorio">
    <div class="report-header">
      <div class="month-nav">
        <button class="btn-ghost" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <div class="month-label" id="month-label">—</div>
        <button class="btn-ghost" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <select class="filter-select" onchange="renderReport()" id="filter-supplier-report">
        <option value="">All suppliers</option>
      </select>
      <button class="btn-ghost print-btn" onclick="window.print()"><i class="ti ti-printer"></i> Print</button>
    </div>
    <div id="report-content"></div>
  </div>
</div>

<!-- LOGIN -->
<div class="modal-overlay open" id="login-overlay">
  <div class="modal" style="max-width:360px;">
    <div class="modal-title">Sign In</div>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Minimum 6 characters"></div>
    </div>
    <div id="login-error" style="color:var(--red);font-size:12px;margin-top:4px;min-height:14px;"></div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px;">New accounts are created by the administrator only.</div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="doLogin()"><i class="ti ti-login"></i> Sign In</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">New Part</div>
    <div class="form-grid">
      <div class="form-group"><label>Part Name *</label><input type="text" id="f-nome" placeholder="E.g.: Oil filter"></div>
      <div class="form-group"><label>Part Code</label><input type="text" id="f-codigo" placeholder="E.g.: 15400-PLM-A02"></div>
      <div class="form-trio">
        <div class="form-group"><label>Vehicle</label><input type="text" id="f-carro" placeholder="E.g.: Honda Civic 2019"></div>
        <div class="form-group"><label>Supplier</label><input type="text" id="f-fornecedor" placeholder="E.g.: John Smith"></div>
        <div class="form-group"><label>Invoice</label><input type="text" id="f-invoice" placeholder="E.g.: INV-10293"></div>
      </div>
      <div class="form-trio">
        <div class="form-group"><label>Quantity</label><input type="number" id="f-qty" placeholder="1" step="1" min="1"></div>
        <div class="form-group"><label>Value (US$)</label><input type="number" id="f-valor" placeholder="0.00" step="0.01" min="0"></div>
        <div class="form-group"><label>Date</label><input type="date" id="f-data"></div>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="f-status">
          <option value="utilizada">Not Returned</option>
          <option value="devolvida">Returned</option>
        </select>
      </div>
      <div class="form-group"><label>Credit</label>
        <select id="f-credito">
          <option value="pendente">Pending</option>
          <option value="creditada">Credited</option>
        </select>
      </div>
      <div class="form-group full"><label>Notes</label><input type="text" id="f-obs" placeholder="Additional notes..."></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="salvar()"><i class="ti ti-device-floppy"></i> Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDO_SHL71igs8O5ODCQnwxhMXVnQ86UBvc",
    authDomain: "gestao-de-pecas-international.firebaseapp.com",
    projectId: "gestao-de-pecas-international",
    storageBucket: "gestao-de-pecas-international.firebasestorage.app",
    messagingSenderId: "531733990676",
    appId: "1:531733990676:web:9b5d3b25f7a233bd210601",
    measurementId: "G-49R6FR0S9T"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const dbFs = getFirestore(fbApp);

  window.IAP_FB = {
    signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
    signOutUser: () => signOut(auth),
    onAuth: (cb) => onAuthStateChanged(auth, cb),
    savePeca: (p) => setDoc(doc(collection(dbFs, 'pecas'), p.id), p),
    deletePeca: (id) => deleteDoc(doc(collection(dbFs, 'pecas'), id)),
    updateCredito: (id, val) => updateDoc(doc(collection(dbFs, 'pecas'), id), { credito: val }),
    listenPecas: (cb, onError) => onSnapshot(collection(dbFs, 'pecas'), snap => {
      const arr = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      cb(arr);
    }, onError)
  };
  window.dispatchEvent(new Event('iapFbReady'));
</script>
<script>
const LS_KEY = 'iap_pecas_v2';
let DB = [];
let editId = null;
let currentTab = 'todas';
let reportMonth = new Date().getMonth();
let reportYear = new Date().getFullYear();

// Storage
function dbLoad() {}
function dbSave() {}
let syncTimer;
function showSync() {
  clearTimeout(syncTimer);
  const el = document.getElementById('sync-status');
  el.style.color = 'var(--green)';
  el.innerHTML = '<i class="ti ti-cloud-check"></i> synced';
  syncTimer = setTimeout(()=>{ el.innerHTML=''; }, 2500);
}
function showSyncError(err) {
  clearTimeout(syncTimer);
  console.error('Firestore sync error:', err);
  if (err && err.code === 'permission-denied') {
    window.IAP_FB.signOutUser();
    document.getElementById('login-error').textContent = 'Account not authorized. Contact the administrator.';
    return;
  }
  const el = document.getElementById('sync-status');
  el.style.color = 'var(--red)';
  el.innerHTML = '<i class="ti ti-cloud-off"></i> sync error';
}

// Auth
function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  window.IAP_FB.signIn(email, pw).catch(e => { errEl.textContent = authErrorMessage(e.code); });
}
function doLogout() {
  window.IAP_FB.signOutUser();
}
function authErrorMessage(code) {
  const map = {
    'auth/invalid-email': 'Invalid email',
    'auth/user-not-found': 'User not found',
    'auth/wrong-password': 'Incorrect password',
    'auth/invalid-credential': 'Invalid email or password',
    'auth/missing-email': 'Enter your email',
    'auth/missing-password': 'Enter your password'
  };
  return map[code] || ('Error: ' + code);
}
function initAuthFlow() {
  window.IAP_FB.onAuth(user => {
    const overlay = document.getElementById('login-overlay');
    if (user) {
      overlay.classList.remove('open');
      document.getElementById('user-email').textContent = user.email;
      window.IAP_FB.listenPecas(data => { DB = data; renderAll(); showSync(); }, showSyncError);
    } else {
      overlay.classList.add('open');
      document.getElementById('user-email').textContent = '';
    }
  });
}
if (window.IAP_FB) { initAuthFlow(); } else { window.addEventListener('iapFbReady', initAuthFlow); }

// Helpers
function fmtVal(v) { return 'US$ ' + (v||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(d) { if(!d) return '—'; const [y,m,di] = d.split('-'); return m+'/'+di+'/'+y.slice(-2); }
let sortDir = 'desc';
function sortByDate(arr) {
  return [...arr].sort((a,b) => sortDir === 'asc' ? (a.data||'').localeCompare(b.data||'') : (b.data||'').localeCompare(a.data||''));
}
function toggleSort() {
  sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  const el = document.getElementById('sort-label');
  if (el) el.textContent = sortDir === 'asc' ? 'Oldest first' : 'Newest first';
  renderAll();
}
function inPeriod(date, fromId, toId) {
  const f = document.getElementById(fromId)?.value;
  const t = document.getElementById(toId)?.value;
  if(f && date < f) return false;
  if(t && date > t) return false;
  return true;
}
function clearDates(prefix) {
  const p = prefix ? prefix+'date' : 'date';
  ['from','to'].forEach(s => { const el = document.getElementById(p+'-'+s); if(el) el.value=''; });
  renderAll();
}

// Card HTML
function cardHTML(p) {
  const sb = p.status === 'devolvida'
    ? '<span class="badge returned"><i class="ti ti-arrow-back-up"></i> Returned</span>'
    : '<span class="badge used"><i class="ti ti-check"></i> Not Returned</span>';
  const creditToggle = p.status === 'devolvida'
    ? `<div class="credit-toggle">
        <button class="credit-opt ${p.credito==='creditada'?'active-green':''}" onclick="setCredito('${p.id}','creditada')">Credited</button>
        <button class="credit-opt ${p.credito==='pendente'?'active-red':''}" onclick="setCredito('${p.id}','pendente')">Pending</button>
      </div>`
    : '';
  const codeLine = p.codigo ? `<span class="part-number"><i class="ti ti-barcode" style="font-size:12px"></i> ${p.codigo}</span>` : '';
  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="piece-name">${p.nome}</div>
        ${codeLine ? `<div class="piece-code">${codeLine}</div>` : ''}
      </div>
      <div class="badges">${sb}</div>
    </div>
    <div class="piece-meta">
      <div class="meta-item"><i class="ti ti-car" style="font-size:11px"></i> Vehicle<span>${p.carro||'—'}</span></div>
      <div class="meta-item"><i class="ti ti-user" style="font-size:11px"></i> Supplier<span>${p.fornecedor||'—'}</span></div>
      <div class="meta-item"><i class="ti ti-calendar" style="font-size:11px"></i> Date<span>${fmtDate(p.data)}</span></div>
      <div class="meta-item"><i class="ti ti-currency-dollar" style="font-size:11px"></i> Amount<span>${fmtVal(p.valor)}</span></div>
      <div class="meta-item"><i class="ti ti-stack" style="font-size:11px"></i> Qty<span>${p.qtd||1}</span></div>
      ${p.invoice ? `<div class="meta-item"><i class="ti ti-file-invoice" style="font-size:11px"></i> Invoice<span>${p.invoice}</span></div>` : ''}
    </div>
    <div class="piece-footer">
      ${p.obs ? `<div class="piece-obs"><i class="ti ti-note"></i><span>${p.obs}</span></div>` : ''}
      <div>${creditToggle}</div>
      <div class="card-actions-right">
        <button class="icon-btn" onclick="openModal('${p.id}')" title="Edit"><i class="ti ti-edit"></i></button>
        <button class="icon-btn danger" onclick="deletar('${p.id}')" title="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>`;
}

function emptyHTML() {
  return '<div class="empty"><i class="ti ti-package-off"></i>No parts found</div>';
}

// Renders
function renderStats() {
  const dev = DB.filter(p => p.status === 'devolvida');
  const pend = dev.filter(p => p.credito === 'pendente');
  document.getElementById('s-total').textContent = DB.length;
  document.getElementById('s-dev').textContent = dev.length;
  document.getElementById('s-pend').textContent = pend.length;
  document.getElementById('s-val').textContent = fmtVal(pend.reduce((s,p)=>s+p.valor,0));
}

function renderTodas() {
  populateSupplierFilter('filter-supplier-todas', false);
  const search = (document.getElementById('search')?.value||'').toLowerCase();
  const fS = document.getElementById('filter-status')?.value||'';
  const fC = document.getElementById('filter-credito')?.value||'';
  const fSup = document.getElementById('filter-supplier-todas')?.value||'';
  const filtered = DB.filter(p => {
    if(search && !`${p.nome} ${p.codigo} ${p.carro} ${p.fornecedor}`.toLowerCase().includes(search)) return false;
    if(fS && p.status !== fS) return false;
    if(fC && p.credito !== fC) return false;
    if(fSup && p.fornecedor !== fSup) return false;
    return inPeriod(p.data, 'date-from', 'date-to');
  });
  const sorted = sortByDate(filtered);
  document.getElementById('list-todas').innerHTML = sorted.length ? sorted.map(cardHTML).join('') : emptyHTML();
}

function renderSec(listId, filter, fromId, toId) {
  const arr = sortByDate(DB.filter(p => filter(p) && inPeriod(p.data, fromId, toId)));
  document.getElementById(listId).innerHTML = arr.length ? arr.map(cardHTML).join('') : emptyHTML();
}

function populateSupplierFilter(selectId, onlyReturned) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const current = sel.value;
  const source = onlyReturned ? DB.filter(p => p.status === 'devolvida') : DB;
  const suppliers = [...new Set(source.filter(p => p.fornecedor).map(p => p.fornecedor))].sort();
  sel.innerHTML = '<option value="">All suppliers</option>' + suppliers.map(s => `<option value="${s}">${s}</option>`).join('');
  if (suppliers.includes(current)) sel.value = current;
}

function renderCreditos() {
  populateSupplierFilter('filter-supplier-credito', true);
  const supplierFilter = document.getElementById('filter-supplier-credito')?.value || '';
  const inPeriodAll = DB.filter(p => p.status === 'devolvida' && inPeriod(p.data, 'cdate-from', 'cdate-to'));

  const bySupplierPending = {};
  inPeriodAll.filter(p => p.credito === 'pendente').forEach(p => {
    const key = p.fornecedor || '—';
    bySupplierPending[key] = (bySupplierPending[key] || 0) + p.valor;
  });
  const supplierRows = Object.entries(bySupplierPending).sort((a, b) => b[1] - a[1]);

  const all = inPeriodAll.filter(p => !supplierFilter || p.fornecedor === supplierFilter);
  const credited = all.filter(p => p.credito === 'creditada');
  const pending = all.filter(p => p.credito === 'pendente');
  const totalCred = credited.reduce((s,p)=>s+p.valor,0);
  const totalPend = pending.reduce((s,p)=>s+p.valor,0);
  const el = document.getElementById('creditos-view');
  if(!all.length) { el.innerHTML = emptyHTML(); return; }
  let html = `<div class="credit-block">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px"><i class="ti ti-report-money"></i> Summary — IAP</div>
    <div class="credit-row"><span>Total returned</span><span style="font-weight:600">${fmtVal(all.reduce((s,p)=>s+p.valor,0))}</span></div>
    <div class="credit-row"><span>Already credited</span><span class="val-green">${fmtVal(totalCred)}</span></div>
    <div class="credit-row"><span>Awaiting credit</span><span class="val-red">${fmtVal(totalPend)}</span></div>
    <div class="total-credit-row"><span>Balance due</span><span class="val-red">${fmtVal(totalPend)}</span></div>
  </div>`;
  if(supplierRows.length) {
    html += `<div class="report-section-title">Pending credit by supplier</div>
    <table class="summary-table">
      <thead><tr><th>Supplier</th><th style="text-align:right">Pending credit</th></tr></thead>
      <tbody>${supplierRows.map(([s,v]) => `<tr><td>${s}</td><td style="text-align:right;font-weight:600" class="val-red">${fmtVal(v)}</td></tr>`).join('')}</tbody>
    </table>`;
  }
  if(pending.length) {
    html += `<div class="report-section-title">Pending (${pending.length})</div>${sortByDate(pending).map(cardHTML).join('')}`;
  }
  if(credited.length) {
    html += `<div class="report-section-title" style="margin-top:1rem">Credited (${credited.length})</div>${sortByDate(credited).map(cardHTML).join('')}`;
  }
  el.innerHTML = html;
}

function renderReport() {
  populateSupplierFilter('filter-supplier-report', false);
  const supplierFilter = document.getElementById('filter-supplier-report')?.value || '';
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-label').textContent = `${months[reportMonth]} ${reportYear}`;
  const yStr = String(reportYear);
  const mStr = String(reportMonth+1).padStart(2,'0');
  const prefix = `${yStr}-${mStr}`;
  const month = DB.filter(p => p.data && p.data.startsWith(prefix) && (!supplierFilter || p.fornecedor === supplierFilter));
  const used = month.filter(p => p.status === 'utilizada');
  const returned = month.filter(p => p.status === 'devolvida');
  const credited = returned.filter(p => p.credito === 'creditada');
  const pending = returned.filter(p => p.credito === 'pendente');
  const totalUsed = used.reduce((s,p)=>s+p.valor,0);
  const totalRet = returned.reduce((s,p)=>s+p.valor,0);
  const totalPend = pending.reduce((s,p)=>s+p.valor,0);
  const totalCred = credited.reduce((s,p)=>s+p.valor,0);

  if(!month.length) {
    document.getElementById('report-content').innerHTML = '<div class="empty"><i class="ti ti-calendar-off"></i>No parts recorded this month</div>';
    return;
  }

  const totalMonth = month.reduce((s,p)=>s+p.valor,0);
  let tableRows = sortByDate(month).map(p => `<tr>
    <td>${p.nome}${p.codigo?`<br><span style="font-size:11px;color:var(--text3)">${p.codigo}</span>`:''}</td>
    <td>${p.carro||'—'}</td>
    <td>${p.fornecedor||'—'}</td>
    <td>${fmtDate(p.data)}</td>
    <td style="text-align:right;font-weight:600">${fmtVal(p.valor)}</td>
    <td>${p.status==='devolvida'?`<span class="badge returned">Ret.</span>`:`<span class="badge used">Not Returned</span>`}</td>
    <td>${p.status==='devolvida'?(p.credito==='creditada'?`<span class="badge credited">Yes</span>`:`<span class="badge pending">No</span>`):'—'}</td>
  </tr>`).join('');

  document.getElementById('report-content').innerHTML = `
    <div class="report-summary">
      <div class="report-card"><div class="report-card-label">Parts this month</div><div class="report-card-val">${month.length}</div></div>
      <div class="report-card"><div class="report-card-label">Not Returned</div><div class="report-card-val" style="color:var(--blue-text)">${used.length} — ${fmtVal(totalUsed)}</div></div>
      <div class="report-card"><div class="report-card-label">Returned</div><div class="report-card-val" style="color:var(--amber)">${returned.length} — ${fmtVal(totalRet)}</div></div>
      <div class="report-card"><div class="report-card-label">Credit received</div><div class="report-card-val" style="color:var(--green)">${fmtVal(totalCred)}</div></div>
      <div class="report-card"><div class="report-card-label">Credit pending</div><div class="report-card-val" style="color:var(--red)">${fmtVal(totalPend)}</div></div>
    </div>
    <div class="report-section-title">All parts this month</div>
    <div style="overflow-x:auto">
    <table class="summary-table">
      <thead><tr>
        <th>Part</th><th>Vehicle</th><th>Supplier</th><th>Date</th><th style="text-align:right">Value</th><th>Status</th><th>Credit</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
      <tfoot><tr style="font-weight:700">
        <td colspan="4" style="text-align:right;padding-top:12px;border-top:1px solid var(--border2)">Total</td>
        <td style="text-align:right;padding-top:12px;border-top:1px solid var(--border2)">${fmtVal(totalMonth)}</td>
        <td colspan="2" style="padding-top:12px;border-top:1px solid var(--border2)"></td>
      </tr></tfoot>
    </table>
    </div>`;
}

function changeMonth(dir) {
  reportMonth += dir;
  if(reportMonth < 0) { reportMonth = 11; reportYear--; }
  if(reportMonth > 11) { reportMonth = 0; reportYear++; }
  renderReport();
}

function renderAll() {
  renderStats();
  renderTodas();
  renderSec('list-utilizadas', p=>p.status==='utilizada', 'udate-from','udate-to');
  renderSec('list-devolvidas', p=>p.status==='devolvida', 'ddate-from','ddate-to');
  renderCreditos();
  renderReport();
}

// Modal
function openModal(id) {
  editId = id || null;
  document.getElementById('modal-title').textContent = id ? 'Edit Part' : 'New Part';
  if(id) {
    const p = DB.find(x => x.id === id);
    if(p) {
      ['nome','codigo','invoice','carro','fornecedor','obs'].forEach(k => document.getElementById('f-'+k).value = p[k]||'');
      document.getElementById('f-data').value = p.data||'';
      document.getElementById('f-valor').value = p.valor||'';
      document.getElementById('f-qty').value = p.qtd||1;
      document.getElementById('f-status').value = p.status||'utilizada';
      document.getElementById('f-credito').value = p.credito||'pendente';
    }
  } else {
    ['nome','codigo','invoice','carro','fornecedor','obs'].forEach(k => document.getElementById('f-'+k).value = '');
    document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-valor').value = '';
    document.getElementById('f-qty').value = 1;
    document.getElementById('f-status').value = 'utilizada';
    document.getElementById('f-credito').value = 'pendente';
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function salvar() {
  const nome = document.getElementById('f-nome').value.trim();
  if (!nome) { alert('Enter the part name'); return; }
  const p = {
    id: editId || Date.now().toString(),
    nome, codigo: document.getElementById('f-codigo').value.trim(),
    invoice: document.getElementById('f-invoice').value.trim(),
    carro: document.getElementById('f-carro').value.trim(),
    fornecedor: document.getElementById('f-fornecedor').value.trim(),
    data: document.getElementById('f-data').value,
    valor: Math.round((parseFloat(document.getElementById('f-valor').value)||0) * 100) / 100,
    qtd: parseInt(document.getElementById('f-qty').value, 10) || 1,
    status: document.getElementById('f-status').value,
    credito: document.getElementById('f-credito').value,
    obs: document.getElementById('f-obs').value.trim()
  };
  window.IAP_FB.savePeca(p).then(()=>{ closeModal(); }).catch(e=>alert('Error saving: '+e.message));
}
function deletar(id) {
  if(!confirm('Remove this part?')) return;
  window.IAP_FB.deletePeca(id).catch(e=>alert('Error removing: '+e.message));
}
function setCredito(id, novo) {
  const p = DB.find(x=>x.id===id);
  if (!p || p.credito === novo) return;
  const msg = novo === 'creditada'
    ? `Confirm that part "${p.nome}" was credited?`
    : `Confirm that part "${p.nome}" is credit pending?`;
  if (!confirm(msg)) return;
  window.IAP_FB.updateCredito(id, novo).catch(e=>alert('Error: '+e.message));
}
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  if(tab === 'relatorio') renderReport();
}

document.getElementById('modal').addEventListener('click', e => { if(e.target === document.getElementById('modal')) closeModal(); });

// Auth flow ja inicializado (initAuthFlow) cuida do carregamento inicial via listenPecas
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
